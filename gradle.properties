# Gradle settings. Machine-specific overrides go in
# ~/.gradle/gradle.properties, never here.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 turns on built-in Kotlin and the new DSL. The ktlint Gradle plugin
# still finds sources through the kotlin-android plugin and the old DSL, so
# both are opted out until it supports AGP 9 in a stable release. AGP 10
# removes these switches; migrate before bumping it.
android.builtInKotlin=false
android.newDsl=false
