name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37 (runner image ships the SDK)
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-37.0"
      - run: make setup
      - run: make check
      - name: Commit subjects carry a task id
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse --verify origin/${{ github.base_ref }} >/dev/null
          bad=$(git log --no-merges --format=%s origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | grep -Ev '^(feat|fix|chore|docs|style|test|refactor|perf|build|ci|spike)(\([a-z0-9-]+\))?: .+ \[PIN-[0-9]+\]$' || true)
          [ -z "$bad" ] || { echo "Commit subjects without the required form:"; echo "$bad"; exit 1; }
